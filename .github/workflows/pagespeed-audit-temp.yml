name: Production CLS audit
on:
  push:
    branches:
      - audit/pagespeed-2026-10-05
    paths:
      - .github/workflows/pagespeed-audit-temp.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Lighthouse CLS details
        run: |
          npm install -g lighthouse@12.8.2
          lighthouse 'https://m-platform-tan.vercel.app/'             --only-categories=performance             --output=json             --output-path=/tmp/lh.json             --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"             --form-factor=mobile             --screenEmulation.mobile=true             --throttling-method=simulate             --quiet
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/lh.json','utf8'));
          const ids=Object.keys(d.audits).filter(id=>/layout|cls|lcp|largest-contentful|font|image/.test(id));
          for(const id of ids){
            const a=d.audits[id];
            if(a.score===1 && !['layout-shifts','largest-contentful-paint-element'].includes(id)) continue;
            console.log('AUDIT '+id+' '+JSON.stringify({
              title:a.title,
              score:a.score,
              numericValue:a.numericValue,
              displayValue:a.displayValue,
              details:a.details
            }));
          }
          const opp=Object.entries(d.audits)
            .filter(([id,a])=>a.details && (a.details.overallSavingsMs||a.details.overallSavingsBytes))
            .map(([id,a])=>({id,title:a.title,score:a.score,ms:a.details.overallSavingsMs||0,bytes:a.details.overallSavingsBytes||0}))
            .sort((a,b)=>(b.ms-a.ms)||(b.bytes-a.bytes))
            .slice(0,12);
          console.log('OPPORTUNITIES '+JSON.stringify(opp));
          NODE

