name: QA development cart
on:
  push:
    branches: [development]
    paths:
      - 'backend/**'
      - 'mobile-app/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/qa-development-cart.yml'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --check backend/modules/cart-orders.mjs
      - run: node --check backend/modules/mutations.mjs
      - run: node --check backend/modules/payments.mjs
      - run: node --check backend/modules/records.mjs
      - run: node --check backend/app.mjs
      - run: npm test
      - run: npm run check
      - run: npm run build
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
