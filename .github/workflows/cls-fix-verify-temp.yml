name: Verify CLS fix
on:
  push:
    branches:
      - fix/cls-site-header-reserve
    paths:
      - .github/workflows/cls-fix-verify-temp.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Tests and build
        run: |
          npm ci
          npm test
          npm ci --prefix mobile-app
          npm test --prefix mobile-app
          VITE_API_ORIGIN=http://127.0.0.1:4173 npm run build --prefix mobile-app
      - name: Browser and Lighthouse against local build with production API
        run: |
          npm install --no-save playwright@1.55.0 lighthouse@12.8.2
          npx playwright install --with-deps chromium
          cat >/tmp/store-proxy.cjs <<'NODE'
          const http=require('http'),fs=require('fs'),path=require('path');
          const root=path.resolve('mobile-app/dist');
          const types={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.svg':'image/svg+xml','.png':'image/png','.jpg':'image/jpeg','.jpeg':'image/jpeg','.webp':'image/webp','.json':'application/json; charset=utf-8'};
          function file(res,p){
            try{
              const data=fs.readFileSync(p);res.writeHead(200,{'content-type':types[path.extname(p)]||'application/octet-stream'});res.end(data);
            }catch{res.writeHead(404);res.end('not found');}
          }
          http.createServer(async(req,res)=>{
            try{
              if(req.url.startsWith('/api/')){
                const upstream=await fetch('https://m-platform-tan.vercel.app'+req.url,{headers:{'x-m-client':'native'}});
                const headers={};for(const [k,v] of upstream.headers)if(!['content-encoding','content-length','transfer-encoding'].includes(k.toLowerCase()))headers[k]=v;
                res.writeHead(upstream.status,headers);res.end(Buffer.from(await upstream.arrayBuffer()));return;
              }
              const u=new URL(req.url,'http://localhost'),rel=decodeURIComponent(u.pathname).replace(/^\/+/,''),candidate=path.join(root,rel||'index.html');
              if(rel&&fs.existsSync(candidate)&&fs.statSync(candidate).isFile())return file(res,candidate);
              return file(res,path.join(root,'index.html'));
            }catch(e){console.error(e);res.writeHead(502);res.end('proxy error');}
          }).listen(4173,'127.0.0.1',()=>console.log('READY 4173'));
          NODE
          node /tmp/store-proxy.cjs >/tmp/store-proxy.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:412,height:915}});
            const errors=[],consoleErrors=[],apiResponses=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('response',r=>{if(r.url().includes('/api/v1/state'))apiResponses.push({url:r.url(),status:r.status()})});
            page.on('requestfailed',r=>{if(r.url().includes('/api/'))consoleErrors.push('REQUEST_FAILED '+r.url()+' '+(r.failure()?.errorText||''))});
            await page.addInitScript(()=>{
              window.__cls=0;
              new PerformanceObserver(list=>{
                for(const e of list.getEntries()) if(!e.hadRecentInput) window.__cls+=e.value;
              }).observe({type:'layout-shift',buffered:true});
            });
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(8000);
            const diagnostics=await page.evaluate(()=>({url:location.href,title:document.title,body:document.body.innerText.slice(0,800),guestHidden:document.getElementById('guestView')?.classList.contains('hidden'),bootHidden:document.getElementById('bootView')?.classList.contains('hidden'),headerExists:!!document.getElementById('site-header'),storeHtml:document.getElementById('guest-storefront')?.innerHTML.slice(0,500)||''}));
            console.log('DIAGNOSTICS '+JSON.stringify({diagnostics,errors,consoleErrors,apiResponses}));
            await page.waitForSelector('#site-header .sf-header',{timeout:5000});
            await page.waitForSelector('.sf-product',{timeout:5000});
            const info=await page.evaluate(()=>({
              cls:window.__cls,
              headerParent:document.getElementById('site-header')?.parentElement?.id||'',
              appTop:document.getElementById('app')?.getBoundingClientRect().top,
              headerHeight:document.getElementById('site-header')?.getBoundingClientRect().height,
              products:document.querySelectorAll('.sf-product').length,
              hasSearch:!!document.querySelector('.sf-header-search input[type=search]'),
              hasCategory:!!document.querySelector('[data-store-category]'),
              bodyText:document.body.innerText.length
            }));
            const cart=page.locator('#site-header [data-store-action="cart"]');
            if(await cart.count()){
              await cart.first().click();
              await page.waitForSelector('#modal:not(.hidden)');
              await page.locator('#modal [data-close-modal]').last().click();
              await page.waitForSelector('#modal.hidden');
            }
            console.log('BROWSER_RESULT '+JSON.stringify({...info,errors,consoleErrors,apiResponses}));
            if(info.headerParent!=='app') throw new Error('site header is not inside app');
            if(info.cls>0.05) throw new Error('CLS too high: '+info.cls);
            if(!info.products||!info.hasSearch||!info.hasCategory||errors.length) throw new Error('storefront smoke failed');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          for n in 1 2 3; do
            npx lighthouse 'http://127.0.0.1:4173/'               --only-categories=performance               --output=json --output-path="/tmp/lh-$n.json"               --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"               --form-factor=mobile --screenEmulation.mobile=true               --throttling-method=simulate --quiet
          done
          node <<'NODE'
          const fs=require('fs');
          const rows=[1,2,3].map(n=>{
            const d=JSON.parse(fs.readFileSync('/tmp/lh-'+n+'.json'));
            const a=d.audits;
            return {
              performance:Math.round(d.categories.performance.score*100),
              fcp:a['first-contentful-paint'].numericValue,
              lcp:a['largest-contentful-paint'].numericValue,
              tbt:a['total-blocking-time'].numericValue,
              cls:a['cumulative-layout-shift'].numericValue,
              speedIndex:a['speed-index'].numericValue,
              bytes:a['total-byte-weight'].numericValue
            };
          });
          const median=k=>rows.map(x=>x[k]).sort((a,b)=>a-b)[1];
          const out={runs:rows,performance:median('performance'),fcp:median('fcp'),lcp:median('lcp'),tbt:median('tbt'),cls:median('cls'),speedIndex:median('speedIndex'),bytes:median('bytes')};
          console.log('LIGHTHOUSE_RESULT '+JSON.stringify(out));
          if(out.cls>0.05) process.exit(2);
          NODE
