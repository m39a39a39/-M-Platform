name: Temporary performance verification
on:
  push:
    branches: [perf/next-bottleneck]
    paths-ignore:
      - perf-audit-summary.json
      - perf-verification-summary.json
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Backend tests and checks
        run: |
          npm ci
          npm test
          npm run check
      - name: Storefront tests and build
        working-directory: mobile-app
        run: |
          npm ci
          npm test
          npm run build
      - name: Browser regression tests
        working-directory: mobile-app
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium webkit
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/mobile-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173 > /dev/null; then break; fi
            sleep 1
          done
          node tests/layout.mjs
          node tests/accounts-search.mjs
      - name: Record verification
        run: |
          printf '{"status":"passed","testedCommit":"%s","testedAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > perf-verification-summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add perf-verification-summary.json
          git commit -m "Record temporary performance verification"
          git push
