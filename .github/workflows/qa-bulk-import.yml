name: QA bulk Excel import
# verifies feature branch before merge
on:
  push:
    branches: ['feature/bulk-excel-product-import']
    paths: ['mobile-app/**','backend/**','tests/**','.github/workflows/qa-bulk-import.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Root backend tests
        run: npm test
      - name: Mobile tests
        working-directory: mobile-app
        run: |
          npm ci
          node --test tests/session.test.mjs tests/bulk-excel.test.mjs
      - name: Mobile build
        working-directory: mobile-app
        run: npm run build
      - name: Install browser test tools
        working-directory: mobile-app
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Mobile browser regression
        working-directory: mobile-app
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/mobile-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173 > /dev/null; then break; fi
            sleep 1
          done
          node tests/layout.mjs
          node tests/accounts-search.mjs
          node tests/bulk-import-ui.mjs
