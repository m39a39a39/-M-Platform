<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M | تسجيل الدخول</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="auth-page">
<main class="auth-card">
<header class="auth-card-head">
<a class="brand-lockup" href="index.html">
<span class="brand-mark">M</span>
<span>
<b>M</b>
<small class="brand-note" data-ar="تسجيل الدخول الآمن" data-en="Secure sign in">تسجيل الدخول الآمن</small>
</span>
</a>
<div class="language-switch">
<button data-lang="ar">ع</button>
<button data-lang="en">EN</button>
</div>
</header>
<form class="auth-card-body" id="loginForm">
<h1 data-ar="مرحبًا بعودتك" data-en="Welcome back">مرحبًا بعودتك</h1>
<p data-ar="اختر نوع حسابك ثم أدخل بيانات الدخول." data-en="Choose your account type and enter your credentials.">اختر نوع حسابك ثم أدخل بيانات الدخول.</p>
<div class="auth-role-switch">
<button type="button" data-auth-role="client" class="active" data-ar="عميل" data-en="Customer">عميل</button>
<button type="button" data-auth-role="supplier" data-ar="مورد" data-en="Supplier">مورد</button>
</div>
<div class="form-grid">
<div class="field full">
<label data-ar="البريد الإلكتروني" data-en="Email">البريد الإلكتروني</label>
<input id="loginEmail" type="email" required autocomplete="email">
</div>
<div class="field full">
<label data-ar="كلمة المرور" data-en="Password">كلمة المرور</label>
<input id="loginPassword" type="password" required autocomplete="current-password">
</div>
</div>
<div class="form-error" id="authError">
</div>
<button class="btn btn-primary btn-wide" type="submit" data-ar="تسجيل الدخول" data-en="Sign in">تسجيل الدخول</button>
<div class="auth-register-actions">
<a class="btn btn-outline" id="registerCustomerLink" href="register-customer.html" data-ar="إنشاء حساب عميل" data-en="Create customer account">إنشاء حساب عميل</a>
<a class="btn btn-dark" id="registerSupplierLink" href="register-supplier.html" data-ar="إنشاء حساب مورد" data-en="Create supplier account">إنشاء حساب مورد</a>
</div>

</form>
</main>
<script src="assets/js/api.js"></script>
<script src="assets/js/common.js">
</script>
<script src="assets/js/moderation.js"></script>
<script src="assets/js/auth.js">
</script>
</body>
</html>
