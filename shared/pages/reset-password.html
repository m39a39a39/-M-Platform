<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M | إعادة تعيين كلمة المرور</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="auth-page">
<main class="auth-card">
<header class="auth-card-head">
<a class="brand-lockup" href="index.html">
<span class="brand-mark">M</span>
<span><b>M</b><small class="brand-note" data-ar="استعادة الحساب" data-en="Account recovery">استعادة الحساب</small></span>
</a>
<div class="language-switch"><button data-lang="ar">ع</button><button data-lang="en">EN</button></div>
</header>
<form class="auth-card-body" id="resetPasswordForm">
<h1 data-ar="كلمة مرور جديدة" data-en="Set a new password">كلمة مرور جديدة</h1>
<p data-ar="اكتب كلمة مرور جديدة لحسابك. يجب أن تكون 8 أحرف على الأقل." data-en="Enter a new password for your account. It must be at least 8 characters.">اكتب كلمة مرور جديدة لحسابك. يجب أن تكون 8 أحرف على الأقل.</p>
<div class="form-grid">
<div class="field full">
<label data-ar="كلمة المرور الجديدة" data-en="New password">كلمة المرور الجديدة</label>
<input id="newPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
</div>
<div class="field full">
<label data-ar="تأكيد كلمة المرور" data-en="Confirm password">تأكيد كلمة المرور</label>
<input id="confirmPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
</div>
</div>
<div class="form-error" id="resetError" role="alert"></div>
<div class="form-success" id="resetSuccess" aria-live="polite"></div>
<button id="resetPasswordBtn" class="btn btn-primary btn-wide" type="submit" data-ar="حفظ كلمة المرور الجديدة" data-en="Save new password">حفظ كلمة المرور الجديدة</button>
<a id="resetLoginLink" class="btn btn-outline btn-wide hidden" href="login.html" data-ar="العودة إلى تسجيل الدخول" data-en="Back to sign in">العودة إلى تسجيل الدخول</a>
</form>
</main>
<script src="assets/js/api.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/reset-password.js"></script>
</body>
</html>
