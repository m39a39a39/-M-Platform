<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMSG | إعادة تعيين كلمة مرور الإدارة</title>
<style>:root{font-family:system-ui,-apple-system,sans-serif;color:#1c2a46;background:#f5f7fc}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
main{width:min(100%,440px);background:#fff;border:1px solid #dee4ef;border-radius:16px;padding:30px;box-shadow:0 8px 36px #1c2a460c}
h1{margin:0 0 10px}h2{font-size:22px;margin:0 0 20px}label{display:block;margin:16px 0;font-weight:600}
input{display:block;width:100%;margin-top:8px;border:1px solid #d5ddeb;border-radius:10px;padding:14px;font-size:16px}
button{width:100%;border:0;border-radius:10px;padding:14px;background:#3655cc;color:white;font-size:17px;cursor:pointer}
button:disabled{opacity:.6}a{display:block;margin-top:20px;color:#3655cc;text-align:center}#message{min-height:24px}
</style></head>
<body><main><h1>IMSG</h1><h2>إعادة تعيين كلمة مرور الإدارة</h2>
<form id="resetForm"><label>كلمة المرور الجديدة<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
<label>تأكيد كلمة المرور<input name="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
<button type="submit">حفظ كلمة المرور</button></form>
<p id="message" role="status" aria-live="polite"></p><a href="/admin.html">العودة إلى تسجيل دخول الإدارة</a></main>
<script type="module" src="/src/admin-password-reset.js"></script></body></html>
