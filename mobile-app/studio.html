<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IMSG | إدارة المتجر</title>
  <style>
    @keyframes studioBootPulse{0%,100%{opacity:.55}50%{opacity:1}}
    #app.studio-boot{min-height:100vh;display:grid;grid-template-columns:250px 1fr;background:#f7f8fa;color:#17324d}
    .studio-boot-side{background:#fff;border-left:1px solid #e6e9ee;padding:22px 16px}
    .studio-boot-main{min-width:0}
    .studio-boot-top{height:70px;background:#fff;border-bottom:1px solid #e6e9ee;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
    .studio-boot-body{padding:24px}
    .studio-boot-line,.studio-boot-block{display:block;background:#e9edf1;border-radius:10px;animation:studioBootPulse 1.15s ease-in-out infinite}
    .studio-boot-brand{width:132px;height:28px;margin-bottom:30px}
    .studio-boot-nav{height:42px;margin:10px 0}
    .studio-boot-title{width:190px;height:24px}
    .studio-boot-action{width:96px;height:36px}
    .studio-boot-hero{height:138px;margin-bottom:18px}
    .studio-boot-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    .studio-boot-card{height:150px}
    @media(max-width:720px){
      #app.studio-boot{grid-template-columns:1fr}
      .studio-boot-side{display:none}
      .studio-boot-top{height:62px;padding:0 16px}
      .studio-boot-body{padding:16px}
      .studio-boot-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
      .studio-boot-card{height:128px}
    }
    @media(prefers-reduced-motion:reduce){.studio-boot-line,.studio-boot-block{animation:none}}
  </style>
  <link rel="stylesheet" href="/studio/style.css">
  <link rel="stylesheet" href="/studio/studio.css">
  <link rel="stylesheet" href="/studio/live.css">
  <link rel="stylesheet" href="/studio/operations.css">
  <link rel="stylesheet" href="/studio/unified.css?v=20261008-admin-chat-mobile-v1">
  <link rel="stylesheet" href="/studio/admin-ai.css?v=20261006-ai-cost-opt-v1">
  <link rel="stylesheet" href="/studio/knowledge-base.css?v=20261008-knowledge-base-v1">
  <link rel="stylesheet" href="/studio/editor.css">
</head>
<body class="studio-shell">
  <div id="app" class="studio-boot" aria-busy="true">
    <aside class="studio-boot-side" aria-hidden="true">
      <span class="studio-boot-line studio-boot-brand"></span>
      <span class="studio-boot-line studio-boot-nav"></span>
      <span class="studio-boot-line studio-boot-nav"></span>
      <span class="studio-boot-line studio-boot-nav"></span>
      <span class="studio-boot-line studio-boot-nav"></span>
      <span class="studio-boot-line studio-boot-nav"></span>
    </aside>
    <main class="studio-boot-main" aria-hidden="true">
      <header class="studio-boot-top">
        <span class="studio-boot-line studio-boot-title"></span>
        <span class="studio-boot-line studio-boot-action"></span>
      </header>
      <div class="studio-boot-body">
        <span class="studio-boot-block studio-boot-hero"></span>
        <div class="studio-boot-grid">
          <span class="studio-boot-block studio-boot-card"></span>
          <span class="studio-boot-block studio-boot-card"></span>
          <span class="studio-boot-block studio-boot-card"></span>
          <span class="studio-boot-block studio-boot-card"></span>
          <span class="studio-boot-block studio-boot-card"></span>
          <span class="studio-boot-block studio-boot-card"></span>
        </div>
      </div>
    </main>
  </div>
  <dialog id="dialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/src/studio-entry.js"></script>
</body>
</html>
