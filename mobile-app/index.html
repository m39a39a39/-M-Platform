<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2236" />
  <style>
    /* Critical startup styles are inline so Safari never flashes the session-check text before CSS loads. */
    #bootView{min-height:100vh;background:#fafbf8}
    .boot-shell{min-height:100vh;background:#fafbf8}
    @media(max-width:600px){
      #site-header.site-header-reserve{height:153px;background:#07182d}
      #site-header.site-header-reserve + #bootView .boot-shell-header{display:none}
    }
  </style>
  <title>IMSG</title>
</head>
<body>
  <div id="app" class="app-shell">
    <div id="site-header" class="site-header-reserve"></div>
    <section id="bootView">
      <div class="boot-shell" aria-busy="true">
        <span hidden aria-hidden="true">جارٍ التحقق من الجلسة...</span>
        <header class="boot-shell-header">
          <span class="boot-skeleton boot-brand"></span>
          <span class="boot-shell-actions"><i class="boot-skeleton"></i><i class="boot-skeleton"></i></span>
        </header>
        <main class="boot-shell-main">
          <div class="boot-skeleton boot-hero"></div>
          <div class="boot-card-grid">
            <article class="boot-card"><span class="boot-skeleton boot-card-image"></span><span class="boot-skeleton boot-card-line"></span><span class="boot-skeleton boot-card-line short"></span></article><article class="boot-card"><span class="boot-skeleton boot-card-image"></span><span class="boot-skeleton boot-card-line"></span><span class="boot-skeleton boot-card-line short"></span></article><article class="boot-card"><span class="boot-skeleton boot-card-image"></span><span class="boot-skeleton boot-card-line"></span><span class="boot-skeleton boot-card-line short"></span></article><article class="boot-card"><span class="boot-skeleton boot-card-image"></span><span class="boot-skeleton boot-card-line"></span><span class="boot-skeleton boot-card-line short"></span></article><article class="boot-card"><span class="boot-skeleton boot-card-image"></span><span class="boot-skeleton boot-card-line"></span><span class="boot-skeleton boot-card-line short"></span></article><article class="boot-card"><span class="boot-skeleton boot-card-image"></span><span class="boot-skeleton boot-card-line"></span><span class="boot-skeleton boot-card-line short"></span></article>
          </div>
        </main>
      </div>
    </section>
    <section id="guestView" class="hidden"><main id="guest-storefront" aria-live="polite"></main></section>

  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-sheet">
      <header class="modal-head"><div><small id="modalKicker"></small><h2 id="modalTitle"></h2></div><button class="modal-close" type="button" data-close-modal>×</button></header>
      <div id="modalBody" class="modal-body"></div>
    </section>
  </div>
  <div id="toast" class="toast hidden"></div>
  <div id="imageViewer" class="image-viewer hidden" role="dialog" aria-modal="true" aria-label="Image viewer">
    <button class="image-viewer-close" type="button" data-image-viewer-close aria-label="Close">×</button>
    <div id="imageViewerStage" class="image-viewer-stage">
      <button id="imageViewerPrev" class="image-viewer-nav image-viewer-prev" type="button" data-image-viewer-prev aria-label="Previous image">‹</button>
      <img id="imageViewerImage" alt="" draggable="false" />
      <button id="imageViewerNext" class="image-viewer-nav image-viewer-next" type="button" data-image-viewer-next aria-label="Next image">›</button>
    </div>
    <div id="imageViewerCounter" class="image-viewer-counter">1 / 1</div>
  </div>
  <script type="module" src="/src/web-entry.js"></script>
</body>
</html>
